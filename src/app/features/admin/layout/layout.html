<div class="admin-container">
  <!-- Overlay para cerrar el menú al tocar fuera en móvil -->
  <div class="overlay" [class.active]="isSidebarOpen" (click)="closeSidebar()"></div>

  <!-- Menú Lateral -->
  <app-sidebar [isOpen]="isSidebarOpen" (closeMenu)="closeSidebar()"></app-sidebar>

  <!-- Contenido Principal -->
  <main class="main-content">
    <!-- Barra superior solo visible en móvil -->
    <header class="mobile-header">
      <button class="hamburger-btn" (click)="toggleSidebar()" aria-label="Abrir menú">
        ☰
      </button>
      <span class="mobile-title">Panel Admin</span>
    </header>

    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<app-toast />
