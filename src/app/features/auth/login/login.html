<div class="login-container">
  <div class="login-card">
    <h1>Panel de Administración</h1>
    <p class="subtitle">Ingresa tus credenciales para gestionar tu peluquería</p>

    @if (demo) { <p class="demo-hint">Modo demo: ya están cargadas las credenciales de prueba (admin@demo.com / demo1234).</p> }

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" [(ngModel)]="loginData.email" required autocomplete="username" placeholder="admin@peluqueria.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="loginData.password" required autocomplete="current-password" placeholder="••••••••">
      </div>

      @if (error()) { <p class="form-error" role="alert">{{ error() }}</p> }

      <button type="submit" class="btn-login" [disabled]="!loginForm.valid || loading()">
        {{ loading() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
